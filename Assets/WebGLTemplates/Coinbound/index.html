<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Coinbound</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102f35;color:#f5f8f0;font-family:system-ui,sans-serif}
#stage{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px)}
canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#102f35;z-index:3;text-align:center;padding:30px}
button{font:inherit;font-weight:700;background:#45d4a6;color:#102f35;border:0;padding:18px 38px;border-radius:8px;min-height:60px;cursor:pointer}
h1{color:#ffca63;font-size:clamp(32px,7vw,64px);margin:0 0 14px}p{max-width:36em;line-height:1.5}progress{width:100%;height:20px;accent-color:#45d4a6}#rotate{display:none;position:fixed;inset:0;z-index:4;background:#102f35;align-items:center;justify-content:center;text-align:center;padding:32px}
@media(orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="stage"><canvas id="unity-canvas" tabindex="0"></canvas></div>
<div id="gate"><div><h1>COINBOUND</h1><p id="status">Rotate your phone to landscape. Tap Play to load the game.</p><button id="play">PLAY</button><progress id="progress" value="0" max="1" hidden></progress></div></div>
<div id="rotate"><div><h1>Rotate your phone</h1><p>Coinbound is played in landscape mode.</p></div></div>
<script>
const play=document.getElementById('play'),status=document.getElementById('status'),progress=document.getElementById('progress'),canvas=document.getElementById('unity-canvas');
function failure(message){status.textContent=String(message);progress.hidden=true;play.textContent='RELOAD';play.disabled=false;play.onclick=()=>location.reload();}
play.onclick=()=>{
 play.disabled=true;play.hidden=true;progress.hidden=false;status.textContent='Loading game…';
 const loader=document.createElement('script');loader.src='Build/{{{ LOADER_FILENAME }}}';
 loader.onerror=()=>{play.hidden=false;failure('Cannot load the game. Check the connection and hosting files.');};
 loader.onload=()=>createUnityInstance(canvas,{
  dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',
  streamingAssetsUrl:'StreamingAssets',companyName:'StudentProject',productName:'Coinbound',productVersion:'0.1.0',
  devicePixelRatio:Math.min(window.devicePixelRatio||1,2)
 },value=>{progress.value=value;}).then(instance=>{
  window.coinbound=instance;document.getElementById('gate').style.display='none';canvas.focus();
 }).catch(error=>{play.hidden=false;failure(error);});
 document.body.appendChild(loader);
};
canvas.addEventListener('contextmenu',event=>event.preventDefault());
</script>
</body>
</html>
